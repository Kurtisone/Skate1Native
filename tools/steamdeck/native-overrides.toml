# Native D3D layer (docs/native_d3d.md), applied after deck-overrides.toml by
# NATIVE=1 tools/steamdeck/build.sh.
# The game's draws are rendered natively (XenosRecomp shaders on plume) and
# shown through the presenter; the emulated GPU only processes the command
# buffers. The emulated build is out/steamdeck/skate1.
native_gpu = true
native_gpu_render = true
native_gpu_present = true
gpu_skip_guest_draws = true
# Only the emulated GPU reads these: not in the native package (out/steamdeck
# or a plain Android build keeps them).
# drop: d3d12_frame_latency_waitable_object d3d12_max_frame_latency
# drop: depth_float24_convert_in_pixel_shader depth_float24_round clear_memory_page_state
# Kept: draw_resolution_scale_x/y. Their default of 2 scales the emulated GPU's
# surfaces even with its draws skipped.
# drop: vulkan_hoist_shared_memory_uploads
# Real vsync. The presenter prefers immediate, then mailbox, whatever vsync says.
vulkan_allow_present_mode_immediate = false
vulkan_allow_present_mode_mailbox = false
